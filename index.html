<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBCC Team List Generator</title>
<style>
  @font-face { font-family: "RobotoBold"; src: url("fonts/Roboto-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "RobotoBlack"; src: url("fonts/Roboto-Black.ttf"); font-weight: 900; }
  @font-face { font-family: "RobotoBlackItalic"; src: url("fonts/Roboto-BlackItalic.ttf"); font-weight: 900; font-style: italic; }

  :root { --green: #0b4a24; --green-2: #0f5f30; --yellow: #fad616; --ink: #10241a; --bg: #eef3ef; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--green); color: #fff; padding: 14px 20px; border-bottom: 5px solid var(--yellow); }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
  header p { margin: 2px 0 0; opacity: .8; font-size: .9rem; }
  main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 24px; padding: 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--green-2); margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid #c9d4cc; border-radius: 8px; font: inherit; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--yellow); border-color: var(--green-2); }
  .row-grade { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row3 select { padding: 9px 4px; font-size: .9rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .players { display: grid; grid-template-columns: 28px 1fr; gap: 6px 8px; align-items: center; }
  .players span { background: var(--green); color: #fff; font-weight: 700; text-align: center; border-radius: 5px; padding: 6px 0; font-size: .85rem; }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button { flex: 1; padding: 12px 14px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  .primary { background: var(--green); color: #fff; }
  .primary:hover { background: var(--green-2); }
  .secondary { background: var(--yellow); color: var(--ink); }
  .ghost { background: transparent; color: var(--green-2); text-decoration: underline; flex: 0 0 auto; padding: 12px 4px; }
  .preview { position: sticky; top: 20px; align-self: start; text-align: center; }
  canvas { width: 100%; max-width: 560px; height: auto; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #ddd; }
  .hint { font-size: .8rem; opacity: .7; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Northern Beaches Cricket Club · Team List Generator</h1>
  <p>Fill in the details, check the preview, then download.</p>
</header>

<main>
  <form class="card" id="form" autocomplete="off" onsubmit="return false">
    <h2>Match</h2>
    <div class="row-grade">
      <div><label for="grade">Grade</label>
        <select id="grade">
          <option>Second Grade</option>
          <option>Third Grade</option>
          <option selected>Fourth Grade</option>
        </select></div>
      <div><label for="round">Round</label><input id="round" type="number" min="1" max="99" inputmode="numeric" placeholder="e.g. 10"></div>
    </div>
    <label for="opponent">Opponent</label>
    <input id="opponent" placeholder="e.g. Saints">
    <div class="row2">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="time">Start time</label><input id="time" type="time" value="08:00"></div>
    </div>
    <label for="venue">Venue / ground</label>
    <input id="venue" placeholder="e.g. Warriewood Oval">

    <h2>Team</h2>
    <div class="players" id="players"></div>
    <div class="row3">
      <div><label for="captain">Captain</label><select id="captain"></select></div>
      <div><label for="vice">Vice-captain</label><select id="vice"></select></div>
      <div><label for="keeper">Wicketkeeper</label><select id="keeper"></select></div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="download">Download PNG</button>
      <button type="button" class="secondary" id="share" hidden>Share…</button>
      <button type="button" class="ghost" id="clear">Clear team</button>
    </div>
    <p class="hint">Each grade's team is remembered separately on this device. Switch grade to load that team.</p>
  </form>

  <section class="preview">
    <canvas id="canvas" width="1024" height="1536" aria-label="Team list preview"></canvas>
    <p class="hint">Preview updates as you type.</p>
  </section>
</main>

<script>
(() => {
  // ---------- layout (pixel positions on the 1024x1536 template) ----------
  const WHITE = "#ffffff", YELLOW = "#fad616", DARK_GREEN = "#0c3a1e", NAME = "#102c24", SHADOW = "#00190a";
  const TITLE_X = 72, TITLE_MAX_X = 795;
  const LINE1_BASE = 444, LINE2_BASE = 498;
  const DATE_MID = 541;
  const VENUE_MID = 617, VENUE_X = 92, VENUE_MAX_X = 575;
  const ROWS = [696, 751, 809, 866, 924, 982, 1041, 1100, 1159, 1218, 1278];
  const ROWS12 = [695, 748, 802, 855, 908, 961, 1014, 1068, 1121, 1174, 1228, 1281];
  const NAME_X = 205, TAG_RIGHT_X = 612;
  const STORE_KEY = "nbcc-teamlist-v1";

  const $ = id => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const template = new Image(), template12 = new Image();

  // ---------- build player inputs ----------
  const playersEl = $("players");
  for (let i = 1; i <= 12; i++) {
    const n = document.createElement("span"); n.textContent = i;
    const inp = document.createElement("input"); inp.id = "p" + i;
    inp.placeholder = i === 12 ? "12th player (optional)" : "Player " + i;
    playersEl.append(n, inp);
  }
  const playerInputs = [...Array(12)].map((_, i) => $("p" + (i + 1)));

  function refreshRoleSelects() {
    for (const sel of [$("captain"), $("vice"), $("keeper")]) {
      const keep = sel.value;
      sel.innerHTML = '<option value="">None</option>' + playerInputs.map((inp, i) =>
        `<option value="${i + 1}">${escapeHtml(inp.value.trim() || "Player " + (i + 1))}</option>`).join("");
      sel.value = keep;
    }
  }
  const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- formatting ----------
  function ordinal(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return n + "TH";
    return n + ({ 1: "ST", 2: "ND", 3: "RD" }[n % 10] || "TH");
  }
  function formatDate(iso) {
    if (!iso) return "DATE TBC";
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const day = dt.toLocaleDateString("en-AU", { weekday: "long" }).toUpperCase();
    const mon = dt.toLocaleDateString("en-AU", { month: "long" }).toUpperCase();
    return `${day} ${ordinal(d)} ${mon}`;
  }
  function formatTime(t) {
    if (!t) return "TIME TBC";
    let [h, m] = t.split(":").map(Number);
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, "0")}${ap}`;
  }
  function nextSunday() {
    const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // ---------- drawing helpers ----------
  const setFont = (family, size) => { ctx.font = `${size}px "${family}"`; };
  function fitFont(text, family, size, maxW, min = 18) {
    while (size > min) { setFont(family, size); if (ctx.measureText(text).width <= maxW) return size; size--; }
    setFont(family, min); return min;
  }
  function baselineForMid(mid) {          // centre capitals vertically on `mid`
    const m = ctx.measureText("H");
    return mid + m.actualBoundingBoxAscent / 2;
  }
  function text(str, x, y, fill, shadow) {
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 2, y + 3); }
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }

  function iconCalendar(x, mid, s = 34) {
    const top = mid - s / 2;
    ctx.strokeStyle = YELLOW; ctx.fillStyle = YELLOW; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(x, top + 4, s, s - 4, 5); ctx.stroke();
    ctx.fillRect(x, top + 4, s, 8);
    for (const px of [x + 9, x + s - 9]) { ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, top + 8); ctx.stroke(); }
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) ctx.fillRect(x + 6 + c * 9, top + 16 + r * 8, 5, 5);
    return s;
  }
  function iconClock(x, mid, s = 36) {
    ctx.strokeStyle = YELLOW; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(x + s / 2, mid, s / 2 - 2, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s / 2, mid); ctx.lineTo(x + s / 2, mid - s * 0.28);
    ctx.moveTo(x + s / 2, mid); ctx.lineTo(x + s / 2 + s * 0.2, mid + s * 0.12); ctx.stroke();
    ctx.lineCap = "butt";
    return s;
  }
  function iconPin(x, mid, colour, s = 36) {
    const r = s * 0.36, cx = x + s / 2, cy = mid - s * 0.12;
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - r * 0.86, cy + r * 0.5); ctx.lineTo(cx + r * 0.86, cy + r * 0.5); ctx.lineTo(cx, mid + s / 2); ctx.fill();
    ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2); ctx.fill();
    return s;
  }

  // ---------- render ----------
  function getData() {
    return {
      grade: $("grade").value, round: $("round").value.trim(), opponent: $("opponent").value, date: $("date").value, time: $("time").value,
      venue: $("venue").value, players: playerInputs.map(i => i.value), captain: $("captain").value, vice: $("vice").value, keeper: $("keeper").value
    };
  }

  function render() {
    const d = getData();
    ctx.textBaseline = "alphabetic";
    const twelve = (d.players[11] || "").trim() !== "";
    ctx.drawImage(twelve ? template12 : template, 0, 0, 1024, 1536);
    const rows = twelve ? ROWS12 : ROWS;

    // Line 1: grade
    const grade = (d.grade || "").toUpperCase() + (d.round ? ` (RND ${d.round})` : "");
    fitFont(grade, "RobotoBlack", 64, TITLE_MAX_X - TITLE_X);
    text(grade, TITLE_X, LINE1_BASE, WHITE, SHADOW);

    // Line 2: VS opponent
    const opp = (d.opponent || "TBA").toUpperCase();
    fitFont("VS " + opp, "RobotoBlack", 64, TITLE_MAX_X - TITLE_X);
    text("VS ", TITLE_X, LINE2_BASE, YELLOW, SHADOW);
    text(opp, TITLE_X + ctx.measureText("VS ").width, LINE2_BASE, WHITE, SHADOW);

    // Line 3: date | time
    const dateTxt = formatDate(d.date), timeTxt = formatTime(d.time);
    let size = 40;
    for (; size > 24; size--) {
      setFont("RobotoBold", size);
      const w = 34 + 14 + ctx.measureText(dateTxt).width + 60 + 36 + 14 + ctx.measureText(timeTxt).width;
      if (w <= TITLE_MAX_X - 78) break;
    }
    setFont("RobotoBold", size);
    const base = baselineForMid(DATE_MID);
    let x = 78;
    x += iconCalendar(x, DATE_MID) + 14;
    setFont("RobotoBold", size);
    text(dateTxt, x, base, WHITE, SHADOW);
    x += ctx.measureText(dateTxt).width + 28;
    ctx.fillStyle = YELLOW; ctx.fillRect(x - 1.5, DATE_MID - 17, 3, 34);
    x += 32;
    x += iconClock(x, DATE_MID) + 14;
    setFont("RobotoBold", size);
    text(timeTxt, x, base, WHITE, SHADOW);

    // Yellow strip: venue
    const venue = (d.venue || "VENUE TBC").toUpperCase();
    iconPin(VENUE_X, VENUE_MID, DARK_GREEN);
    fitFont(venue, "RobotoBlackItalic", 44, VENUE_MAX_X - VENUE_X - 46);
    text(venue, VENUE_X + 46, baselineForMid(VENUE_MID), DARK_GREEN);

    // Players
    d.players.forEach((raw, i) => {
      const name = raw.trim();
      if (!name) return;
      if (i >= rows.length) return;
      const mid = rows[i];
      const tags = [];
      if (d.captain === String(i + 1)) tags.push("(C)");
      if (d.vice === String(i + 1)) tags.push("(VC)");
      if (d.keeper === String(i + 1)) tags.push("(WK)");
      const tag = tags.join(" ");
      setFont("RobotoBold", twelve ? 34 : 36);
      const tagW = tag ? ctx.measureText(tag).width : 0;
      if (tag) text(tag, TAG_RIGHT_X - tagW, baselineForMid(mid), NAME);
      fitFont(name, "RobotoBold", twelve ? 35 : 37, TAG_RIGHT_X - NAME_X - (tag ? tagW + 16 : 0));
      text(name, NAME_X, baselineForMid(mid), NAME);
    });
  }

  // ---------- persistence (one saved team per grade) ----------
  const STORE_KEY_V2 = "nbcc-teamlist-v2";
  let store = { lastGrade: "Fourth Grade", grades: {} };
  try {
    const raw = localStorage.getItem(STORE_KEY_V2);
    if (raw) store = JSON.parse(raw);
    else {                                   // migrate data saved by the first version
      const old = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (old) store.grades["Fourth Grade"] = old;
    }
  } catch (e) {}
  let currentGrade = store.lastGrade || "Fourth Grade";

  function save() {
    const d = getData();
    store.grades[currentGrade] = d;
    store.lastGrade = currentGrade;
    try { localStorage.setItem(STORE_KEY_V2, JSON.stringify(store)); } catch (e) {}
  }
  function fillForm(grade) {
    const s = store.grades[grade] || {};
    $("grade").value = grade;
    $("round").value = s.round || "";
    $("opponent").value = s.opponent || "";
    $("time").value = s.time || "08:00";
    $("venue").value = s.venue || "";
    playerInputs.forEach((inp, i) => { inp.value = (s.players || [])[i] || ""; });
    // Default to next Sunday unless the saved date is still upcoming
    const t = new Date();
    const today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    $("date").value = s.date && s.date >= today ? s.date : nextSunday();
    refreshRoleSelects();
    $("captain").value = s.captain || "";
    $("vice").value = s.vice || "";
    $("keeper").value = s.keeper || "";
  }
  function load() { fillForm(currentGrade); }

  $("grade").addEventListener("change", e => {
    e.stopPropagation();
    save();                                  // keep the grade we're leaving (saved under currentGrade)
    currentGrade = $("grade").value;
    fillForm(currentGrade);
    save(); render();
  });

  // ---------- output ----------
  function fileName() {
    const opp = ($("opponent").value || "TBA").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
    const grade = $("grade").value.replace(/\s+/g, "_");
    const rnd = $("round").value.trim() ? `_Rnd${$("round").value.trim()}` : "";
    return `TeamList_${grade}${rnd}_${$("date").value || "TBC"}_vs_${opp}.png`;
  }
  const toBlob = () => new Promise(res => canvas.toBlob(res, "image/png"));

  $("download").addEventListener("click", async () => {
    render(); save();
    const url = URL.createObjectURL(await toBlob());
    const a = document.createElement("a"); a.href = url; a.download = fileName();
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  // Native share sheet (phones) – straight to Messenger, WhatsApp, Facebook etc.
  if (navigator.canShare) {
    const probe = new File([new Blob()], "x.png", { type: "image/png" });
    if (navigator.canShare({ files: [probe] })) $("share").hidden = false;
  }
  $("share").addEventListener("click", async () => {
    render(); save();
    const file = new File([await toBlob()], fileName(), { type: "image/png" });
    try { await navigator.share({ files: [file], title: "NBCC Team List" }); } catch (e) {}
  });

  $("clear").addEventListener("click", () => {
    playerInputs.forEach(i => i.value = "");
    $("captain").value = ""; $("vice").value = ""; $("keeper").value = "";
    refreshRoleSelects(); render(); save();
  });

  $("form").addEventListener("input", e => {
    if (e.target.id && e.target.id.startsWith("p")) refreshRoleSelects();
    render(); save();
  });
  $("form").addEventListener("change", () => { render(); save(); });

  // ---------- start ----------
  load();
  Promise.all([
    new Promise((res, rej) => { template.onload = res; template.onerror = rej; template.src = "template.jpg"; }),
    new Promise((res, rej) => { template12.onload = res; template12.onerror = rej; template12.src = "template12.jpg"; }),
    document.fonts.load('64px "RobotoBlack"'), document.fonts.load('40px "RobotoBold"'), document.fonts.load('44px "RobotoBlackItalic"')
  ]).then(render).catch(err => alert("Couldn't load the template or fonts: " + err));
})();
</script>
</body>
</html>
